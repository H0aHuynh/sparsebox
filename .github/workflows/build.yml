name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-latest  # Hoặc thử macos-26 nếu có sẵn (kiểm tra GitHub docs để confirm)

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26.0'  # Chọn phiên bản Xcode 26.x mới nhất có sẵn trên runner

      - name: Verify Xcode version
        run: xcodebuild -version  # Để kiểm tra xem đã chọn đúng chưa (optional nhưng khuyến khích)

      - name: Build
        run: |
          xcodebuild -scheme SparseBox -derivedDataPath build -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload packages
          cp -R build/Build/Products/Debug-iphoneos/SparseBox.app Payload/
          zip -r packages/SaiGonToolkit.ipa Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          name: artifact
          path: packages/*.ipa